_base_: ../_base_/default.yaml

model:
  reasoning_effort: medium
  optimizer: GLM-5.2
  target: GLM-5.2
  target_backend: codex_exec

train:
  num_epochs: 3
  batch_size: 10
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 4

optimizer:
  learning_rate: 4
  skill_update_mode: full_rewrite_minibatch

evaluation:
  use_gate: true
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

env:
  name: gbrain
  skill_init: skillopt/envs/gbrain/skills/initial.md
  split_mode: ratio
  data_path: /home/huawei/桌面/gbrain-evals/eval/data/skillopt-v1/seed-no-brain-first/benchmark.jsonl
  split_ratio: "8:3:4"
  split_seed: 42
  split_output_dir: ""
  max_completion_tokens: 16384
  workers: 8
  limit: 0
  exec_timeout: 300
  codex_exec_path: /home/huawei/.local/bin/codex
  codex_exec_network_access: true
  codex_exec_web_search: true
