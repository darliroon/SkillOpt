_base_: ../_base_/default.yaml

model:
  optimizer: gpt-5.6-sol
  target: gpt-5.6-sol

train:
  num_epochs: 8
  train_size: 0
  batch_size: 40
  accumulation: 1

env:
  name: livemathematicianbench
  skill_init: skillopt/envs/livemathematicianbench/skills/initial.md
  split_mode: split_dir
  split_dir: data/livemathematicianbench_split
  data_path: ""
  split_output_dir: ""
  max_turns: 1

  # Rollout阶段 chat_target()调用-Target模型答题时的输出token上限
  max_completion_tokens: 16384
  exec_timeout: 300
  workers: 36
  limit: 0
  shuffle_choices: true
  use_theorem: false
  use_sketch: false
