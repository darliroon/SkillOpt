_base_: ../_base_/default.yaml

model:
  reasoning_effort: medium

train:
  num_epochs: 1          # 1 epoch (was 4)
  train_size: 0          # 0 = auto-derive from split (80)
  batch_size: 10         # 10 per step (was 40) -> 8 steps/epoch
  accumulation: 1

gradient:
  minibatch_size: 4      # was 8
  merge_batch_size: 4     # was 8

optimizer:
  learning_rate: 4

evaluation:
  sel_env_num: 5         # 5 selection items (was 0 = all 40)
  test_env_num: 10       # 10 test items (was 0 = all 280)

env:
  name: spreadsheetbench
  skill_init: skillopt/envs/spreadsheetbench/skills/initial.md
  split_mode: split_dir
  split_dir: data/spreadsheetbench_split
  data_path: ""
  split_output_dir: ""
  data_root: data/spreadsheetbench_verified_400
  mode: multi          # single shot (was multi) — no retry loop
  max_turns: 10          # 1 round only
  max_completion_tokens: 4096  # 4K tokens (was 16384) — faster generation
  exec_timeout: 300      # 5 min — enough for 1 reasoning + generation cycle
  workers: 4             # 4 workers — safe for API limits
